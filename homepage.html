<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人主页</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            line-height: 1.6;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: url('https://img.669929.xyz/uploads/2025/02/12/67ac1cc1a3e47.webp') center center/cover fixed;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.2);
            z-index: 0;
        }

        .container {
            background: rgba(255, 255, 255, 0.6);
            #backdrop-filter: blur(6px);
            border-radius: 24px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
            padding: 3rem;
            width: 90%;
            max-width: 600px;
            text-align: center;
            position: relative;
            overflow: hidden;
            z-index: 1;
        }

        .avatar-container {
            position: relative;
            width: 180px;
            height: 180px;
            margin: 0 auto 2rem;
            z-index: 1;
        }

        .avatar {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            transition: transform 0.3s ease;
            object-fit: cover;
        }

        .avatar:hover {
            transform: scale(1.05);
        }

        .name {
            font-size: 2.2rem;
            font-weight: 700;
            margin-bottom: 1rem;
            color: #333;
            position: relative;
            z-index: 1;
        }

        .bio {
            color: #444;
            margin-bottom: 2rem;
            font-size: 1.1rem;
            position: relative;
            z-index: 1;
        }

        .contact-links {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 1rem;
            margin-top: 2rem;
            position: relative;
            z-index: 1;
            max-width: 480px;
            margin-left: auto;
            margin-right: auto;
        }

        .contact-link {
            color: #444;
            text-decoration: none;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 0.5rem;
            transition: all 0.3s ease;
            padding: 1rem;
            border-radius: 12px;
            min-width: 80px;
            aspect-ratio: 1;
        }

        .contact-link:hover {
            transform: translateY(-5px);
            background: rgba(255, 255, 255, 0.3);
        }

        .icon {
            font-size: 1.5rem;
            transition: transform 0.3s ease;
        }

        .contact-link:hover .icon {
            transform: scale(1.1);
        }

        .label {
            font-size: 0.9rem;
            font-weight: 500;
            transition: opacity 0.3s ease;
            white-space: nowrap;
        }

        @media (max-width: 480px) {
            .container {
                padding: 2rem;
            }
            
            .avatar-container {
                width: 140px;
                height: 140px;
            }

            .name {
                font-size: 1.8rem;
            }

            .contact-links {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
                padding: 0 1rem;
            }

            .contact-link {
                padding: 0.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="avatar-container">
            <img src="https://img.669929.xyz/uploads/2024/12/14/675c6e78f2c07.webp" alt="个人头像" class="avatar">
        </div>
        <h1 class="name">Rational</h1>
        <p class="bio">保持热爱</p>
        <div class="contact-links">
            <a href="https://ecouu.com" class="contact-link" target="_blank" title="个人博客">
                <i class="fas fa-blog icon"></i>
                <span class="label">个人博客</span>
            </a>
            <a href="https://domain.xxui.de" class="contact-link" target="_blank" title="域名出售">
                <i class="fas fa-globe icon"></i>
                <span class="label">域名出售</span>
            </a>
            <a href="https://github.com/ecouus" class="contact-link" target="_blank" title="GitHub 主页">
                <i class="fab fa-github icon"></i>
                <span class="label">GitHub</span>
            </a>
            <a href="https://t.me/nanoms_bot" class="contact-link" target="_blank" title="Telegram">
                <i class="fab fa-telegram icon"></i>
                <span class="label">TG</span>
            </a>
        </div>
    </div>
</body>
</html>

<!DOCTYPE html>
<html lang="zh">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Domain Sale</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
        }
        .domain-card {
            background: white;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
        .domain-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        .price-tag {
            background: linear-gradient(to right, #2563eb, #3b82f6);
            cursor: pointer;
        }
        .price-tag:hover {
            opacity: 0.9;
        }
        .contact-card {
            background: white;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }
    </style>
</head>
<body class="min-h-screen py-12">
    <div class="max-w-6xl mx-auto px-4">
        <!-- 标题 -->
        <div class="text-center mb-16">
            <h1 class="text-4xl font-bold text-gray-900 mb-4">Domain Sale</h1>
            <p class="text-xl text-gray-600">Premium Domains For Sale</p>
        </div>

        <!-- 域名网格 -->
        <div id="domainGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-8 mb-16">
            <!-- 域名卡片将通过 JavaScript 动态生成 -->
        </div>

        <!-- 联系方式 -->
        <div class="contact-card rounded-2xl p-8 max-w-lg mx-auto">
            <h2 class="text-2xl font-bold text-gray-800 text-center mb-6">联系方式</h2>
            <div class="space-y-4">
                <a href="https://t.me/nanoms_bot" target="_blank" class="flex items-center justify-center text-gray-600 hover:text-blue-600 transition-colors">
                    <svg class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M21.2 3.8c-.2-.2-.5-.3-.8-.2L2.8 9.9c-.4.1-.6.5-.6.9s.3.7.7.8l5 1.3L18.3 5c.1-.1.2 0 .2.1v.1l-9.8 9.5c-.1.1-.2.3-.2.5v5.4c0 .4.3.8.7.9h.4c.2 0 .5-.1.6-.3l2.7-3.2 4.3 3.2c.2.1.4.2.6.2.1 0 .3 0 .4-.1.3-.1.5-.4.6-.7l3.4-16.5c-.1-.3-.2-.5-.4-.7z"/>
                    </svg>
                    <span>TG联系</span>
                </a>
                <a href="mailto:admin@ecouu.com" class="flex items-center justify-center text-gray-600 hover:text-blue-600 transition-colors">
                    <svg class="w-6 h-6 mr-2" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <rect x="2" y="4" width="20" height="16" rx="2"/>
                        <path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/>
                    </svg>
                    <span>邮箱联系</span>
                </a>
            </div>
        </div>
    </div>

    <script>
        // 域名数据配置
        const domains = [
            {
                name: "YouDao.li",
                description: "有道理 · Regery",
                price: "¥888"
            },
            {
                name: "yumday.org",

                price: "¥50"
            },
            {
                name: "yyru.ru",
                description: "aabb · Regery",
                price: "¥25"
            },
            {
                name: "yyru.ru",
                description: "aabb · Regery",
                price: "¥25"
            },
            {
                name: "yocc.ru",
                description: "🌽 · Regery",
                price: "¥20"
            },
            {
                name: "HenHe.li",
                description: "很合理 · Regery",
                price: "已售"
            },
            {
                name: "suv.im",
                description: "suv · Dynadot",
                price: "已售"
            },
            {

            },

            },

                description: "悠米 · Spaceship",
                price: "已售"
            }
        ];

        // 生成域名卡片的函数
        function createDomainCard(domain) {
            return `
                <div class="domain-card rounded-2xl p-8 flex flex-col items-center">
                    <div class="text-2xl font-bold text-gray-800 mb-3">${domain.name}</div>
                    <div class="text-gray-600 mb-6">${domain.description}</div>
                    <div class="price-tag text-white px-6 py-2 rounded-full font-medium" 
                         onclick="window.open('https://t.me/nanoms_bot', '_blank')">
                        ${domain.price}
                    </div>
                </div>
            `;
        }

        // 渲染所有域名卡片
        function renderDomainCards() {
            const domainGrid = document.getElementById('domainGrid');
            domainGrid.innerHTML = domains.map(domain => createDomainCard(domain)).join('');
        }

        // 页面加载时渲染域名卡片
        renderDomainCards();
    </script>
</body>
</html>
